apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: oracle-cdc
  namespace: cdc
  labels:
    strimzi.io/cluster: connect
spec:
  class: sh.oso.connect.oracle.OracleCdcSourceConnector
  tasksMax: 1
  state: running
  autoRestart:
    enabled: true
    maxRestarts: 5
  # where the strimzi.io/connector-offsets=list annotation writes the offsets
  listOffsets:
    toConfigMap:
      name: oracle-cdc-offsets
  config:
    cdc.database.host: oracle
    cdc.database.port: "1521"
    cdc.database.service: FREE
    cdc.database.user: C##CDC
    cdc.database.password: cdc
    cdc.database.pdbs: FREEPDB1
    cdc.topic.prefix: cdc
    cdc.tables.include: FREEPDB1\.WORKLOAD\..*
    cdc.tables.exclude: "FREEPDB1\\.WORKLOAD\\.WL_LEDGER"
