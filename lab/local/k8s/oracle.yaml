# Oracle Database Free from docker/test-oracle (loaded with minikube image load). StatefulSet so the
# datafiles survive pod restarts; deleting the PVC is itself an edge-case test. The base must be the
# regular (not faststart) image: faststart ships the datafiles inside the image under
# /opt/oracle/oradata, and a volume mounted there hides them.
apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: cdc
spec:
  clusterIP: None
  selector:
    app: oracle
  ports:
    - name: listener
      port: 1521
---
apiVersion: v1
kind: Secret
metadata:
  name: oracle-sys
  namespace: cdc
type: Opaque
stringData:
  ORACLE_PASSWORD: oracle
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: cdc
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: oracle
          image: oracle-cdc-test-db:23.26.3-slim
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              rm -rf /dev/shm/* 2>/dev/null
              for id in $(ipcs -s 2>/dev/null | awk "NR>3 && \$2 ~ /^[0-9]+$/ {print \$2}"); do ipcrm -s "$id"; done
              for id in $(ipcs -m 2>/dev/null | awk "NR>3 && \$2 ~ /^[0-9]+$/ {print \$2}"); do ipcrm -m "$id"; done
              exec container-entrypoint.sh
          ports:
            - containerPort: 1521
              name: listener
          envFrom:
            - secretRef:
                name: oracle-sys
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
            - name: archive
              mountPath: /opt/oracle/archive
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  printf "SELECT 'UP' FROM v\$database WHERE open_mode = 'READ WRITE';\n" \
                    | sqlplus -s -L c##cdc/cdc@//$(hostname -f):1521/FREE | grep -q UP
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  printf "SELECT 'UP' FROM v\$pdbs WHERE name = 'FREEPDB1' AND open_mode = 'READ WRITE';\n" \
                    | sqlplus -s -L c##cdc/cdc@//$(hostname -f):1521/FREE | grep -q UP
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: archive
          emptyDir:
            sizeLimit: 20Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 30Gi
