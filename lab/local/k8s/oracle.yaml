# Oracle Database Free from docker/test-oracle (loaded with minikube image load). StatefulSet so the
# datafiles survive pod restarts; deleting the PVC is itself an edge-case test. The base must be the
# regular (not faststart) image: faststart ships the datafiles inside the image under
# /opt/oracle/oradata, and a volume mounted there hides them.
apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: cdc
spec:
  clusterIP: None
  selector:
    app: oracle
  ports:
    - name: listener
      port: 1521
---
apiVersion: v1
kind: Secret
metadata:
  name: oracle-sys
  namespace: cdc
type: Opaque
stringData:
  ORACLE_PASSWORD: oracle
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: cdc
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: oracle
          image: oracle-cdc-test-db:23.26.3-slim
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              # A previous container in this pod (or a pod force-deleted while still running on the
              # same volume) can leave an instance or its shared memory behind: ORA-01081 on start.
              # Abort any such instance, then clear POSIX shm and System V IPC before the entrypoint.
              sqlplus -s / as sysdba <<'SQL' >/dev/null 2>&1 || true
              shutdown abort;
              exit
              SQL
              rm -rf /dev/shm/* 2>/dev/null || true
              if command -v ipcs >/dev/null 2>&1; then
                for id in $(ipcs -s 2>/dev/null | awk 'NR>3 && $2 ~ /^[0-9]+$/ {print $2}'); do ipcrm -s "$id" 2>/dev/null || true; done
                for id in $(ipcs -m 2>/dev/null | awk 'NR>3 && $2 ~ /^[0-9]+$/ {print $2}'); do ipcrm -m "$id" 2>/dev/null || true; done
              fi
              exec /opt/oracle/container-entrypoint.sh
          ports:
            - containerPort: 1521
              name: listener
          envFrom:
            - secretRef:
                name: oracle-sys
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
            # archived redo must survive a pod restart: an emptyDir here lost the logs the
            # connector still needed and it stopped, correctly, with CDC-2002 LOG_PURGED
            - name: data
              mountPath: /opt/oracle/archive
              subPath: archive
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  printf "SELECT 'UP' FROM v\$database WHERE open_mode = 'READ WRITE';\n" \
                    | sqlplus -s -L / as sysdba | grep -q UP
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  printf "SELECT 'UP' FROM v\$pdbs WHERE name = 'FREEPDB1' AND open_mode = 'READ WRITE';\n" \
                    | sqlplus -s -L / as sysdba | grep -q UP
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 30Gi
