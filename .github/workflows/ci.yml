name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build, quality gates and unit tests
        run: ./mvnw clean verify -DskipE2E --batch-mode --no-transfer-progress

      - name: Upload connector plugin ZIP
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: connect-plugin-zip
          path: kafka-connect-oracle-cdc/target/*-kafka-connect-plugin.zip
          retention-days: 14

      - name: Upload oracle-cdc-doctor CLI
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-cdc-doctor-cli
          path: oracle-cdc-doctor/target/oracle-cdc-doctor-*-cli.jar
          retention-days: 14

  license-gate-selftest:
    name: licence gate rejects a GPL dependency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build must fail when a GPL artefact is added
        run: |
          set +e
          ./mvnw -q -pl bench -am -Plicense-selftest validate --batch-mode --no-transfer-progress
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::the licence gate let a GPL dependency through"
            exit 1
          fi
          echo "licence gate correctly rejected the GPL dependency (exit $status)"

  migration-tools:
    name: migration tools (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/migration
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: tools/migration/uv.lock
      - name: Install the locked environment
        run: uv sync --locked
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format --check
        run: uv run --locked ruff format --check .
      - name: pytest
        run: uv run --locked pytest -q

  t1-engine:
    name: T1 engine (Oracle Database Free)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork pull requests have no Docker Hub secrets; maintainers re-run after review.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Log in to Docker Hub (avoids anonymous pull limits)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build modules without tests
        run: ./mvnw -q install -DskipTests -DskipE2E --batch-mode --no-transfer-progress
      - name: Oracle-only integration tests
        run: ./mvnw -pl e2e-tests verify -De2e.groups=engine --batch-mode --no-transfer-progress
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-engine-reports
          path: e2e-tests/target/failsafe-reports/
          retention-days: 7

  t1-connector:
    name: T1 connector (Oracle Database Free, Kafka, Connect worker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Fork pull requests have no Docker Hub secrets; maintainers re-run after review.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Log in to Docker Hub (avoids anonymous pull limits)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up uv and Python 3.11 (DebeziumCutoverConnectorIT runs the migration tools)
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: tools/migration/uv.lock
      - name: Build modules without tests
        run: ./mvnw -q install -DskipTests -DskipE2E --batch-mode --no-transfer-progress
      - name: Oracle, Kafka and Connect worker integration tests
        run: ./mvnw -pl e2e-tests verify -De2e.groups=connector --batch-mode --no-transfer-progress
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-connector-reports
          path: e2e-tests/target/failsafe-reports/
          retention-days: 7
      - name: Upload the Debezium cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-evidence
          path: e2e-tests/target/migration-evidence.json
          if-no-files-found: ignore
          retention-days: 30

  central-dry-run:
    name: Maven Central dry run (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Release profile, throwaway signature, upload to a loopback stub, bundle checked
        env:
          # a short keyring path: gpg-agent sockets live in it and Unix socket paths are limited
          CENTRAL_DRY_RUN_GNUPGHOME: ${{ runner.temp }}/dry-run-gnupg
        run: release/central-dry-run.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks over the checked-out tree (CLAUDE.md, no secrets)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

  workflows:
    name: workflow lint and release guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Only release-please creates releases and tags
        run: |
          set -euo pipefail
          # the bracketed letters stop this line from matching itself
          if grep -nE 'git ([t]ag|[p]ush)|gh release [c]reate|action-gh-[r]elease|actions/[c]reate-release|/git/[r]efs' .github/workflows/*.yml; then
            echo "::error::a workflow creates a tag, release or pushes; only release-please may create releases (CLAUDE.md, Releasing)"
            exit 1
          fi
          echo "No workflow creates tags or releases"
