name: Verify release secrets

# Manual check, before the first release and after rotating anything, that the secrets release.yml
# needs are present and usable. It never prints a secret and publishes nothing:
#   - CENTRAL_USERNAME and CENTRAL_TOKEN (or the organisation's OSSRH_USERNAME and OSSRH_TOKEN, which
#     hold Central Portal tokens): a read-only query to the Central Portal publisher API
#   - MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE: import into a temporary keyring, sign and
#     verify a probe file, check expiry, and look the public key up on the keyservers Central uses
#   - DOCKERHUB_USERNAME and DOCKERHUB_TOKEN: optional, reported only
# It runs in the `release` environment, so environment secrets are seen exactly as release.yml sees
# them. GHCR needs no secret: release.yml pushes with GITHUB_TOKEN.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Required secrets are set
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in CENTRAL_USERNAME CENTRAL_TOKEN MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            if [ -n "${!name:-}" ]; then
              echo "present: ${name}"
            else
              echo "::error::secret ${name} is missing or empty (for the Central pair, CENTRAL_* or OSSRH_*)"
              missing=1
            fi
          done
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "present: ${name} (optional)"
            else
              echo "::notice::optional secret ${name} is not set; the T1 jobs pull images anonymously"
            fi
          done
          exit "$missing"

      - name: Central Portal accepts the publishing token
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_TOKEN }}
        run: |
          set -euo pipefail
          bearer=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_TOKEN" | base64 -w0)
          echo "::add-mask::${bearer}"
          # Read-only: asks whether a version that is never released is published. The header is
          # passed on standard input so it does not appear in the process list.
          status=$(printf 'Authorization: Bearer %s\n' "$bearer" | curl -sS -o /dev/null -w '%{http_code}' -H @- \
            'https://central.sonatype.com/api/v1/publisher/published?namespace=sh.oso&name=oracle-cdc-core&version=0.0.0-verify')
          case "$status" in
            200) echo "Central Portal accepted the token (HTTP 200)" ;;
            401|403) echo "::error::Central Portal rejected the publishing token (CENTRAL_* or OSSRH_*, HTTP ${status}); generate a user token at central.sonatype.com"; exit 1 ;;
            *) echo "::warning::Central Portal answered HTTP ${status}; the token could not be confirmed" ;;
          esac

      - name: Signing key imports, signs with the passphrase and is published
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/verify-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT

          if ! printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --quiet --import >/dev/null 2>&1; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is not an importable OpenPGP secret key (export it with gpg --armor --export-secret-keys)"
            exit 1
          fi
          fpr=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ -z "$fpr" ]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY holds no secret key"
            exit 1
          fi
          echo "Signing key fingerprint (public information): ${fpr}"

          probe="${RUNNER_TEMP}/release-secrets-probe.txt"
          echo "release secrets probe" > "$probe"
          if ! printf '%s' "$MAVEN_GPG_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --local-user "$fpr" --armor --detach-sign --output "${probe}.asc" "$probe" 2>/dev/null; then
            echo "::error::the key does not sign with MAVEN_GPG_PASSPHRASE"
            exit 1
          fi
          gpg --batch --quiet --verify "${probe}.asc" "$probe" 2>/dev/null
          echo "A probe file signed and verified with the key and passphrase"

          expires=$(gpg --batch --with-colons --list-keys "$fpr" | awk -F: '$1 == "pub" { print $7; exit }')
          if [ -n "$expires" ]; then
            days=$(( (expires - $(date -u +%s)) / 86400 ))
            if [ "$days" -lt 0 ]; then
              echo "::error::the signing key expired ${days#-} days ago"
              exit 1
            elif [ "$days" -lt 60 ]; then
              echo "::warning::the signing key expires in ${days} days"
            else
              echo "The signing key expires in ${days} days"
            fi
          else
            echo "The signing key has no expiry date"
          fi

          found=""
          for server in keyserver.ubuntu.com keys.openpgp.org; do
            if curl -sSf "https://${server}/pks/lookup?op=get&options=mr&search=0x${fpr}" 2>/dev/null \
                | grep -q 'BEGIN PGP PUBLIC KEY BLOCK'; then
              echo "Public key found on ${server}"
              found="yes"
            else
              echo "Public key not found on ${server}"
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::Central verifies signatures against public keyservers; publish the key, for example gpg --keyserver keyserver.ubuntu.com --send-keys ${fpr}"
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          {
            echo "### Release secrets verified"
            echo
            echo "Central token accepted, signing key usable and published. GHCR pushes use GITHUB_TOKEN;"
            echo "after the first image push, check that the oracle-cdc-doctor package is linked to this repository and public."
          } >> "$GITHUB_STEP_SUMMARY"
