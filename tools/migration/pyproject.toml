[project]
name = "oso-cdc-migration"
version = "0.1.0.dev0"
description = "Migration tools for the OSO CDC Connector for Oracle Database: configuration translators, takeover offsets and cutover verification."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OSO DevOps Ltd" }]
dependencies = [
  "oracledb>=2.4",
  "confluent-kafka>=2.3",
]

[project.scripts]
migrate-from-debezium = "oso_cdc_migration.debezium:main"
migrate-from-confluent = "oso_cdc_migration.confluent:main"
takeover-scn = "oso_cdc_migration.takeover:main"
verify-cutover = "oso_cdc_migration.verify:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oso_cdc_migration"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["oso_cdc_migration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
