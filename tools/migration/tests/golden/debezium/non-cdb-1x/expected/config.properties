name=legacy-oracle-oso
connector.class=sh.oso.connect.oracle.OracleCdcSourceConnector
tasks.max=1
cdc.capture.mode=archive_only
cdc.database.host=legacy-db
cdc.database.password=${file:/etc/kafka/oracle.properties:password}
cdc.database.port=1521
cdc.database.service=LEGACY
cdc.database.user=dbzuser
cdc.decimal.mode=string
cdc.key.missing=none
cdc.lob.mode=skip
cdc.output.format=debezium
cdc.snapshot.mode=none
cdc.tables.exclude=FINANCE\\.AUDIT_.*
cdc.tables.include=FINANCE\\..+,HR\\..+
cdc.temporal.mode=adaptive
cdc.tombstones.on.delete=false
cdc.topic.prefix=legacy
cdc.topic.template=${prefix}.${schema}.${table}
cdc.transaction.max.age.action=discard
cdc.transaction.max.age.ms=14400000
