# Debezium 1.9 style configuration for a non-CDB database
name=legacy-oracle
connector.class=io.debezium.connector.oracle.OracleConnector
tasks.max=1
database.hostname=legacy-db
database.port=1521
database.user=dbzuser
database.password=${file:/etc/kafka/oracle.properties:password}
database.dbname=LEGACY
database.server.name=legacy
schema.whitelist=FINANCE,HR
table.blacklist=FINANCE\\.AUDIT_.*
database.history.kafka.topic=legacy.history
database.history.kafka.bootstrap.servers=kafka:9092
log.mining.transaction.retention.hours=4
log.mining.archive.log.only.mode=true
snapshot.mode=schema_only
tombstones.on.delete=false
decimal.handling.mode=string
time.precision.mode=adaptive_time_microseconds
heartbeat.interval.ms=0
